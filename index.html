<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>

<body>
<h1> Coding Moms — Daily Hustle Checklist</h1>
<ul class="todo-list">
<li>
    <input type="checkbox" Id="task1">
    <label for="task1">Morning Stand-up Call</label>
    <ul class="sub-item">
        <li><a class="sub-item-link" href="https://calendar.google.com" target="_blank">📅 Link to schedule</a></li>
      </ul>
</li>
<li>
      <input type="checkbox" id="task2">
      <label for="task2">Finish HTML/CSS Module</label>
      <ul class="sub-item">
           <li><a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">Practice here</a></li>
   </ul> 
    </li>
    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Reply to Client Emails</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://zapier.com/blog/inbox-zero-email-management/" target="_blank">Productivity tip</a></li>
      </ul>
    </li> 
     <li>
      <input type="checkbox" id="task4">
      <label for="task4">Plan Dinner Before 6PM</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://tasty.co" target="_blank">Quick meal ideas</a></li>
      </ul>
    </li>     
</ul>
</body>
<footer>
    <p class="quote">💬 “You’re not just coding — you’re building dreams between nap times.”</p>
  </footer>
</html>
